name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: Record Node runtime
        run: |
          node --version
          node -p "process.execPath"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
