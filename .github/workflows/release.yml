name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: Record Node runtime
        run: |
          node --version
          node -p "process.execPath"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy main.js to root (Obsidian convention)
        run: cp dist/main.js main.js

      - name: Create zip
        run: zip obsidian-external-image-opener.zip main.js manifest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" main.js manifest.json obsidian-external-image-opener.zip
